<!DOCTYPE html>

    <title>Sử Ta - Game Lịch Sử Việt Nam</title>

<body>

    <div class="game-screen">
        
        <div class="top-bar">
            
            <div class="panel player-info player-info--guest" onmouseover="this.style.background='rgba(55, 38, 26, 0.9)'" onmouseout="this.style.background='rgba(35, 24, 16, 0.88)'" onclick="moBangDangNhap()">
                
                <div class="avatar avatar--guest">
                    ?
                </div>
                
                <div class="info-text">
                    <h3 class="guest-name">KHÁCH TRUY CẬP</h3>
                    <div class="guest-hint">
                        Chạm để Đăng nhập
                    </div>
                </div>
            </div>

            <div class="resources">
                <!-- Vàng + kim cương (SUTA-DB-01; bỏ năng lượng ⚡). home.js chỉ ghi số vào [data-res]. -->
                <div class="panel res-item"><span class="res-icon res-icon--gold" role="img" aria-label="Vàng"></span> <span data-res="gold">0</span> <button class="btn-plus">+</button></div>
                <div class="panel res-item">💎 <span data-res="gems">0</span> <button class="btn-plus">+</button></div>
                <button class="btn panel btn-settings">⚙️</button>
            </div>
        </div>

        <div class="main-area">
            
            <div class="left-menu">
                
                <button class="btn btn-side" onclick="openAchievements()"><span class="btn-side__icon">🏆</span> <span class="btn-side__label">THÀNH TỰU</span></button>
                <!-- <button class="btn btn-side">💼 NHIỆM VỤ HẰNG NGÀY</button> -->
                <button class="btn btn-side" onclick="openLeaderboard()"><span class="btn-side__icon">📊</span> <span class="btn-side__label">BẢNG XẾP HẠNG</span></button>
                <button class="btn btn-side"><span class="btn-side__icon">🏪</span> <span class="btn-side__label">CỬA HÀNG</span></button>
                <button class="btn btn-side" onclick="window.location.href='/history'"><span class="btn-side__icon">📖</span> <span class="btn-side__label">THƯ VIỆN LỊCH SỬ</span></button>
            </div>

            <div class="center-menu">
                <div class="logo-area">
                    <!-- logo2.webp: bản thu nhỏ của logo2.png (tools/make_home_images.py). -->
                    <img src="{{ url_for('static', filename='assets/images/logo2.webp') }}" alt="Logo Sử Ta" class="game-logo">
                    <div class="subtitle">HỌC LỊCH SỬ BẰNG CÁCH SỐNG TRONG LỊCH SỬ</div>
                </div>

                <div class="main-actions">
                <a href="/gameplay/levels/trung-trac" id="btn-start-game" class="btn btn-main btn-3d btn-start">
                    <div>⚔️ BẮT ĐẦU CHƠI</div>
                    <span style="font-size: 13px; color: #ffeb3b; font-weight: normal;">(Chưa chọn tướng)</span>
                </a>

                <button class="btn btn-main btn-green btn-3d"
                        type="button"
                        onclick="openTimeline()">
                    🗺️ CHỌN CHƯƠNG
                </button>

            
                <button class="btn btn-main btn-purple btn-3d" 
                        type="button"
                        onclick="window.location.href='/quiz'">
                    🕹️ CÂU HỎI LỊCH SỬ
                </button>
                </div>
               
            </div>
