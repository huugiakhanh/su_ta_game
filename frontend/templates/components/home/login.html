<!-- Đăng nhập/đăng ký + hồ sơ của trang chủ (HOME-LAZY-01: tải khi bấm ô người chơi — js/home/login.js). -->
<div id="loginModal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:#3e2723; padding:25px; border:3px solid #f1c40f; z-index:100; text-align:center; border-radius:8px; width:min(320px, 92vw); max-height:92vh; max-height:92dvh; overflow-y:auto; box-shadow:0 0 20px rgba(0,0,0,0.8);">
    <div style="display:flex; margin-bottom:15px; border-bottom:2px solid #5d4037;">
        <button id="tabLoginBtn" style="flex:1; background:#5d4037; color:#f1c40f; border:none; padding:8px; font-weight:bold; cursor:pointer;" onclick="doiTab('login')">ĐĂNG NHẬP</button>
        <button id="tabRegBtn" style="flex:1; background:#2b1d14; color:#aaa; border:none; padding:8px; font-weight:bold; cursor:pointer;" onclick="doiTab('register')">ĐĂNG KÝ</button>
    </div>

    <div id="formLogin">
        <input type="text" id="loginUser" placeholder="Tài khoản" style="padding:8px; margin-bottom:10px; width:100%;"><br>
        <input type="password" id="loginPass" placeholder="Mật khẩu" style="padding:8px; margin-bottom:15px; width:100%;"><br>
        <button class="btn" style="padding:10px; width:100%; font-size:14px; margin-bottom:8px;" onclick="xacNhanDangNhap()">Đăng Nhập Ngay</button>
    </div>

    <div id="formRegister" style="display:none;">
        <input type="text" id="regName" placeholder="Tên nhân vật trong game" style="padding:8px; margin-bottom:10px; width:100%;"><br>
        <input type="text" id="regUser" placeholder="Tài khoản mới" style="padding:8px; margin-bottom:10px; width:100%;"><br>
        <input type="password" id="regPass" placeholder="Mật khẩu mới" style="padding:8px; margin-bottom:10px; width:100%;"><br>
        <!-- Avatar (SUTA-DB-01): js/home/login.js vẽ ảnh vào [data-avatar]. -->
        <div class="avatar-picker" role="radiogroup" aria-label="Chọn avatar">
            <label class="avatar-option">
                <input type="radio" name="regAvatar" value="male" checked>
                <span class="avatar avatar-option__img" data-avatar="male"></span>
                <span class="avatar-option__label">Nam</span>
            </label>
            <label class="avatar-option">
                <input type="radio" name="regAvatar" value="female">
                <span class="avatar avatar-option__img" data-avatar="female"></span>
                <span class="avatar-option__label">Nữ</span>
            </label>
        </div>
        <button class="btn btn-green" style="padding:10px; width:100%; font-size:14px; margin-bottom:8px;" onclick="xacNhanDangKy()">Tạo Tài Khoản</button>
    </div>

    <button class="btn" style="padding:8px; width:100%; font-size:12px; filter:grayscale(100%); background:#777;" onclick="document.getElementById('loginModal').style.display='none'">Đóng</button>
    <p id="authMessage" style="color:#ffcc00; margin-top:10px; font-size:12px;"></p>
</div>

<!-- Hồ sơ người chơi đã đăng nhập (SUTA-DB-01): đổi avatar + đăng xuất. -->
<div id="profileModal" class="profile-modal" hidden>
    <h3 class="profile-modal__name" id="profileName"></h3>
    <p class="profile-modal__hint">Chọn avatar</p>
    <div class="avatar-picker">
        <button type="button" class="avatar-option" data-avatar-choice="male">
            <span class="avatar avatar-option__img" data-avatar="male"></span>
            <span class="avatar-option__label">Nam</span>
        </button>
        <button type="button" class="avatar-option" data-avatar-choice="female">
            <span class="avatar avatar-option__img" data-avatar="female"></span>
            <span class="avatar-option__label">Nữ</span>
        </button>
    </div>
    <p class="profile-modal__message" id="profileMessage"></p>
    <button class="btn" style="padding:10px; width:100%; font-size:14px; margin-bottom:8px;" onclick="dangXuat()">Đăng Xuất</button>
    <button class="btn" style="padding:8px; width:100%; font-size:12px; filter:grayscale(100%); background:#777;" onclick="dongHoSo()">Đóng</button>
</div>
