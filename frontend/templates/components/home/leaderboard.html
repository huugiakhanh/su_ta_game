<!-- Bảng xếp hạng (HOME-LAZY-01 — js/home/leaderboard.js). -->
<div id="leaderboard-modal" class="modal-overlay" style="display: none;">
    <div class="leaderboard-container">
        
        <div class="leaderboard-header">
            <h2 class="leaderboard-title">BẢNG XẾP HẠNG</h2>
        </div>

        <button class="close-btn" onclick="document.getElementById('leaderboard-modal').style.display='none'">X</button>

        <div class="leaderboard-tabs">
            <!-- data-scope: phạm vi gửi /api/game/leaderboard?scope= (SUTA-DB-01;
                 quiz — SUTA-QUIZ-LB). Thêm chương mới: thêm 1 nút chapter-N. -->
            <button class="tab-btn active" data-scope="all">🏆 TOÀN GAME</button>
            <button class="tab-btn" data-scope="chapter-1">👩 TRƯNG TRẮC</button>
            <button class="tab-btn" data-scope="chapter-2">🐘 BÀ TRIỆU</button>
            <button class="tab-btn" data-scope="quiz">📜 QUIZ</button>
            <!-- <button class="tab-btn">🧔 ĐINH BỘ LĨNH</button> -->
            <!-- <button class="tab-btn">📜 LÝ CÔNG UẨN</button> -->
            <!-- <button class="tab-btn">⚔️ LÊ LỢI</button> -->
        </div>

        <div class="table-wrapper">
            <table class="leaderboard-table">
                <thead>
                    <!-- Tiêu đề cột đổi theo tab (home.js — LEADERBOARD_COLUMNS). -->
                    <tr id="leaderboard-table-head">
                        <th>HẠNG</th>
                        <th>NGƯỜI CHƠI</th>
                        <th>ĐÃ QUA MÀN</th>
                        <th>TỔNG ĐIỂM</th>
                        <th>THỜI GIAN</th>
                        <th>THÀNH TÍCH</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-table-body">
                    <!-- Javascript sẽ nhúng các thẻ <tr> vào đây -->
                </tbody>
            </table>
        </div>

        <!-- Hạng của bản thân ở dưới cùng -->
        <div class="my-rank-footer" id="my-rank-footer">
            <div class="my-rank-title">HẠNG CỦA BẠN<br><span id="my-current-rank">NO</span></div>
            <div class="my-rank-info">
                <span id="my-current-name">Khách</span>
                <span id="my-current-score">⭐ 0</span>
            </div>
        </div>

    </div>
</div>
