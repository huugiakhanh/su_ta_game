<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUTA - Level Test</title>
    <link rel="stylesheet" href="/gameplay/level/level test/level-test.css">
</head>
<body>
    <main class="game-wrap">
        <section class="hud">
            <div>
                <strong>LEVEL TEST</strong>
                <span>Di chuyen, nhay, luot</span>
            </div>
            <a href="/" class="back-link">Ve trang chinh</a>
        </section>

        <section class="stage" id="stage">
            <div class="sky">
                <div class="cloud cloud-one"></div>
                <div class="cloud cloud-two"></div>
            </div>

            <div class="player" id="player" aria-label="Nhan vat chinh"></div>
            <div class="ground"></div>
        </section>

        <section class="controls">
            <button type="button" class="control-btn" data-key="left">Trai</button>
            <button type="button" class="control-btn" data-key="right">Phai</button>
            <button type="button" class="control-btn" data-key="jump">Nhay</button>
            <button type="button" class="control-btn" data-key="dash">Luot</button>
        </section>

        <p class="guide">
            Phim may tinh: A/D hoac mui ten de di chuyen, Space de nhay, Shift de luot.
        </p>
    </main>
    <script>
const playerEl = document.getElementById("player");
const stageEl = document.getElementById("stage");

const FRAME_SIZE = 128;
const GRAVITY = 2200;
const MOVE_SPEED = 280;
const JUMP_FORCE = 780;
const DASH_SPEED = 720;
const DASH_TIME = 0.18;

let currentAnimState = ""; 

const animImages = {
    idle: "url('/ảnh/characters/origin male/stance.gif')",
    run:  "url('/ảnh/characters/origin male/run.gif')",
    jump: "url('/ảnh/characters/origin male/jump.gif')",
    dash: "url('/ảnh/characters/origin male/dash.gif')"
};

const keys = {
    left: false,
    right: false
};

const player = {
    x: 120,
    y: 0,
    vx: 0,
    vy: 0,
    direction: 1,
    grounded: true,
    dashing: false,
    dashTimer: 0,
    state: "idle",
    frame: 0,
    frameTimer: 0
};

let lastTime = performance.now();

function setKey(code, isDown) {
    if (code === "ArrowLeft" || code === "KeyA") {
        keys.left = isDown;
    }

    if (code === "ArrowRight" || code === "KeyD") {
        keys.right = isDown;
    }
}

function jump() {
    if (!player.grounded || player.dashing) return;

    player.vy = JUMP_FORCE;
    player.grounded = false;
}

function dash() {
    if (player.dashing) return;

    player.dashing = true;
    player.dashTimer = DASH_TIME;
    player.vx = player.direction * DASH_SPEED;
}

function chooseState() {
    if (player.dashing) return "dash";
    if (!player.grounded) return "jump";
    if (keys.left || keys.right) return "run";
    return "idle";
}

function setAnimation(nextState) {
    if (player.state === nextState) return;

    player.state = nextState;
    player.frame = 0;
    player.frameTimer = 0;
}

function animate(delta) {
    // NOTE FIX CODE: Lấy ảnh theo state. Nếu state bị lỗi không tồn tại, tự động lấy ảnh idle làm bảo hiểm
    const nextImage = animImages[player.state] || animImages.idle;

    if (player.state !== currentAnimState) {
        // NOTE FIX CODE: Gán trực tiếp ảnh an toàn đã lọc ở trên
        playerEl.style.backgroundImage = nextImage;
        currentAnimState = player.state;
    }
}

function update(delta) {
    const stageWidth = stageEl.clientWidth;
    const maxX = stageWidth - FRAME_SIZE;

    if (player.dashing) {
        player.dashTimer -= delta;

        if (player.dashTimer <= 0) {
            player.dashing = false;
        }
    } else {
        player.vx = 0;

        if (keys.left) {
            player.vx = -MOVE_SPEED;
            player.direction = -1;
        }

        if (keys.right) {
            player.vx = MOVE_SPEED;
            player.direction = 1;
        }
    }

    player.vy -= GRAVITY * delta;
    player.x += player.vx * delta;
    player.y += player.vy * delta;

    if (player.y <= 0) {
        player.y = 0;
        player.vy = 0;
        player.grounded = true;
    } else {
        player.grounded = false;
    }

    player.x = Math.max(0, Math.min(maxX, player.x));

    setAnimation(chooseState());
    animate(delta);
    render();
}

function render() {
    playerEl.style.left = `${player.x}px`;
    playerEl.style.bottom = `${92 + player.y}px`; // Nâng đáy gốc lên 92px

    // Tính toán tỉ lệ phóng to: Nếu đang ở trạng thái jump thì phóng to 1.25 lần
    const scaleFactor = (player.state === "jump") ? 1.5 : 1.0;
    const directionFactor = (player.direction === -1) ? -1 : 1;

    // Áp dụng scale đồng thời cho cả hướng quay (trái/phải) và kích thước
    playerEl.style.transform = `scaleX(${directionFactor}) scale(${scaleFactor})`;
    
    playerEl.classList.toggle("dashing", player.dashing);
}

function gameLoop(now) {
    const delta = Math.min((now - lastTime) / 1000, 0.033);
    lastTime = now;

    update(delta);
    requestAnimationFrame(gameLoop);
}

document.addEventListener("keydown", function (event) {
    setKey(event.code, true);

    if (event.code === "Space" || event.code === "ArrowUp" || event.code === "KeyW") {
        event.preventDefault();
        jump();
    }

    if (event.code === "ShiftLeft" || event.code === "ShiftRight" || event.code === "KeyK") {
        dash();
    }
});

document.addEventListener("keyup", function (event) {
    setKey(event.code, false);
});

document.querySelectorAll(".control-btn").forEach(function (button) {
    const action = button.dataset.key;

    button.addEventListener("pointerdown", function () {
        if (action === "left") keys.left = true;
        if (action === "right") keys.right = true;
        if (action === "jump") jump();
        if (action === "dash") dash();
    });

    button.addEventListener("pointerup", function () {
        if (action === "left") keys.left = false;
        if (action === "right") keys.right = false;
    });

    button.addEventListener("pointerleave", function () {
        if (action === "left") keys.left = false;
        if (action === "right") keys.right = false;
    });
});

setAnimation("idle");
render();
requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
